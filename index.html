<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW-WEAPON Presentation Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    /* Sleek Slide Deck Cards */
    .slide-card {
      width: 100%;
      box-sizing: border-box;
      padding: 2.25rem;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      border-radius: 16px;
      margin-bottom: 2rem;
      border: 1px solid #334155;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .slide-card:hover {
      border-color: #38bdf8;
    }
    .slide-card h1 {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid #334155;
    }
    .slide-card h2 {
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 1rem;
      margin-bottom: 0.75rem;
    }
    .slide-card h3 {
      color: #7dd3fc;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .slide-card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 0.75rem;
    }
    .slide-card ul {
      list-style-type: none;
      padding-left: 0;
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .slide-card li {
      font-size: 1.05rem;
      position: relative;
      padding-left: 1.75rem;
      margin-bottom: 0.75rem;
      line-height: 1.6;
      color: #e2e8f0;
    }
    .slide-card li::before {
      content: "✦";
      position: absolute;
      left: 0;
      color: #38bdf8;
      font-size: 0.9rem;
      top: 0.1rem;
    }
    .slide-card strong {
      color: #38bdf8;
      font-weight: 700;
    }
    .slide-card blockquote {
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid #38bdf8;
      padding: 0.75rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1rem 0;
      font-style: italic;
      color: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-slate-800 p-4 bg-slate-900 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-black tracking-tight text-sky-400">🚀 HW-WEAPON</h1>
      <span class="bg-sky-500/10 text-sky-400 text-xs px-2.5 py-1 rounded-full border border-sky-500/20 font-semibold">Pro Slide Engine</span>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">
    
    <section class="flex flex-col gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">1. Input Homework / Essay / Notes</h2>
        
        <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 cursor-pointer transition-all flex items-center gap-1.5 font-medium">
          📁 Import Text File
          <input type="file" id="fileInput" accept=".txt,.md" class="hidden" onchange="importFile(event)">
        </label>
      </div>

      <textarea id="inputText" placeholder="Type your topic, paste your assignment, or import a text file..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:outline-none focus:border-sky-500 resize-none min-h-[350px] leading-relaxed"></textarea>
      
      <button id="generateBtn" onclick="generateSlides()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition-all text-base shadow-lg shadow-sky-500/20">
        ✨ Generate Multi-Slide Deck
      </button>
    </section>

    <section class="flex flex-col gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">2. Live Deck Preview</h2>
        
        <div class="flex gap-2">
          <button onclick="downloadPPTX()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 shadow-md shadow-emerald-600/20">
            📊 Download PowerPoint (.pptx)
          </button>
          
          <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition-all font-medium">
            📄 Print / Save PDF
          </button>
        </div>
      </div>

      <div id="previewArea" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-5 overflow-y-auto max-h-[650px]">
        <div class="text-center text-slate-500 py-28">
          <p class="text-base">Your generated slides will render visual cards right here!</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    const OPENROUTER_API_KEY = "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";

    window.currentRawMarkdown = "";

    function importFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('inputText').value = e.target.result;
        };
        reader.readAsText(file);
      }
    }

    async function generateSlides() {
      const text = document.getElementById('inputText').value;
      const btn = document.getElementById('generateBtn');
      const preview = document.getElementById('previewArea');

      if (!text.trim()) {
        alert('Please enter or import some text first!');
        return;
      }

      btn.disabled = true;
      btn.innerText = '🤖 Designing Slide Deck...';

      // Advanced multi-slide layout system prompt
      const systemPrompt = `You are HW-WEAPON, a world-class presentation designer.
Convert the user's input into an engaging, multi-slide presentation (4 to 7 slides).

STRICT OUTPUT RULES:
1. Divide content into logically separated slides.
2. Separate EACH slide using '---' on its own line.
3. Slide 1 MUST be a Title Slide with a main title (#) and a subtitle/overview paragraph.
4. Each subsequent slide MUST start with a bold slide title (# Heading).
5. Use bullet points (- or *) for content, keeping them short, clear, and impactful.
6. Use **bolding** for key concepts to make slides visually scannable.
7. Return ONLY raw Markdown without wrapping in code blocks (\`\`\`markdown).`;

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'openrouter/free',
            max_tokens: 1500,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: text }
            ]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || JSON.stringify(data.error));
        }

        let markdownResult = data.choices[0].message.content;

        // Strip model thinking blocks if present
        markdownResult = markdownResult.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
        window.currentRawMarkdown = markdownResult.replace(/```markdown/gi, '').replace(/```/g, '').trim();

        // Parse markdown slides into separate visual cards
        const slideArray = window.currentRawMarkdown.split(/^---$/m);
        let renderedCardsHtml = "";

        slideArray.forEach((slideMd, index) => {
          const cleanMd = slideMd.trim();
          if (cleanMd.length > 0) {
            const slideHtml = window.marked.parse(cleanMd);
            renderedCardsHtml += `
              <div class="slide-card">
                <div class="flex justify-between items-center mb-3">
                  <span class="text-xs font-black text-sky-400 bg-sky-500/10 px-3 py-1 rounded-full border border-sky-500/20 uppercase tracking-widest">
                    Slide ${index + 1} of${slideArray.length}
                  </span>
                </div>
                ${slideHtml}
              </div>`;
          }
        });

        preview.innerHTML = renderedCardsHtml || '<p class="text-red-400">No slides generated. Try again.</p>';

      } catch (err) {
        alert('Generation failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '✨ Generate Multi-Slide Deck';
      }
    }

    function downloadPPTX() {
      if (!window.currentRawMarkdown) {
        alert('Please generate a presentation first!');
        return;
      }

      let pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';

      const slideTexts = window.currentRawMarkdown.split(/^---$/m);

      slideTexts.forEach(slideMd => {
        const lines = slideMd.trim().split('\n').filter(l => l.trim().length > 0);
        if (lines.length === 0) return;

        let slide = pptx.addSlide();
        slide.background = { color: '0F172A' };

        let yPosition = 0.8;

        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('#')) {
            const titleText = line.replace(/^#+\s*/, '');
            slide.addText(titleText, {
              x: 0.8, y: yPosition, w: '85%',
              fontSize: 24, bold: true, color: '38BDF8',
              fontFace: 'Arial'
            });
            yPosition += 0.9;
          } else if (line.startsWith('-') || line.startsWith('*')) {
            const bulletText = line.replace(/^[-*]\s*/, '').replace(/\*\*(.*?)\*\*/g, '$1');
            slide.addText(bulletText, {
              x: 1.0, y: yPosition, w: '80%',
              fontSize: 16, color: 'F8FAFC',
              bullet: true, fontFace: 'Arial'
            });
            yPosition += 0.5;
          } else {
            const cleanText = line.replace(/\*\*(.*?)\*\*/g, '$1');
            slide.addText(cleanText, {
              x: 0.8, y: yPosition, w: '85%',
              fontSize: 15, color: 'CBD5E1',
              fontFace: 'Arial'
            });
            yPosition += 0.5;
          }
        });
      });

      pptx.writeFile({ fileName: 'HW-WEAPON-Presentation.pptx' });
    }
  </script>
</body>
</html>
