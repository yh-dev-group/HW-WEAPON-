<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW-WEAPON Presentation Generator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marpit for Slide Preview -->
  <script src="https://cdn.jsdelivr.net/npm/@marp-team/marpit@2.4.0/lib/marpit.umd.js"></script>
  <!-- PptxGenJS for PPTX Export -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    .slide-preview section {
      width: 100%;
      box-sizing: border-box;
      padding: 2.5rem;
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .slide-preview h1 { color: #38bdf8; font-size: 2em; font-weight: bold; border-bottom: 2px solid #38bdf8; margin-bottom: 1rem; padding-bottom: 0.2rem; }
    .slide-preview h2 { color: #38bdf8; font-size: 1.5em; margin-bottom: 0.8rem; }
    .slide-preview p, .slide-preview li { font-size: 1.1em; margin-bottom: 0.5rem; line-height: 1.5; }
    .slide-preview ul { list-style-type: disc; padding-left: 1.5rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 p-4 bg-slate-900 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-black tracking-tight text-sky-400">🚀 HW-WEAPON</h1>
      <span class="bg-sky-500/10 text-sky-400 text-xs px-2 py-0.5 rounded border border-sky-500/20">Unlimited AI Deck Engine</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">
    
    <!-- Input Panel -->
    <section class="flex flex-col gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">1. Input Homework / Essay / Notes</h2>
        
        <!-- File Import Button -->
        <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 cursor-pointer transition-all flex items-center gap-1.5 font-medium">
          📁 Import Text File
          <input type="file" id="fileInput" accept=".txt,.md" class="hidden" onchange="importFile(event)">
        </label>
      </div>

      <textarea id="inputText" placeholder="Type your topic, paste your assignment, or import a text file..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:outline-none focus:border-sky-500 resize-none min-h-[350px] leading-relaxed"></textarea>
      
      <button id="generateBtn" onclick="generateSlides()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition-all text-base shadow-lg shadow-sky-500/20">
        ✨ Generate Presentation
      </button>
    </section>

    <!-- Visual Output Panel -->
    <section class="flex flex-col gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">2. Presentation Live Preview</h2>
        
        <div class="flex gap-2">
          <!-- PowerPoint Export Button -->
          <button onclick="downloadPPTX()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 shadow-md shadow-emerald-600/20">
            📊 Download PowerPoint (.pptx)
          </button>
          
          <!-- PDF Export Button -->
          <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition-all font-medium">
            📄 Print / Save PDF
          </button>
        </div>
      </div>

      <div id="previewArea" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-5 overflow-y-auto max-h-[600px] slide-preview">
        <div class="text-center text-slate-500 py-24">
          <p class="text-base">Your generated presentation slides will render visually right here!</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    // --- PRE-CONFIGURED FREE DEEPSEEK API KEY ---
    const API_KEY = "YOUR_DEEPSEEK_API_KEY_HERE"; // Paste key here once!

    const marpit = new window.Marpit.Marpit();
    let currentRawMarkdown = "";

    // 1. File Upload Handler
    function importFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('inputText').value = e.target.result;
        };
        reader.readAsText(file);
      }
    }

    // 2. AI Presentation Generator
    async function generateSlides() {
      const text = document.getElementById('inputText').value;
      const btn = document.getElementById('generateBtn');
      const preview = document.getElementById('previewArea');

      if (!text.trim()) {
        alert('Please enter or import some text first!');
        return;
      }

      btn.disabled = true;
      btn.innerText = '🤖 AI Writing Your Presentation...';

      try {
        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              {
                role: 'system',
                content: 'You are HW-WEAPON. Convert the user input into clean Markdown slides. Use `---` on its own line to separate slides. Use standard headings (#) and concise bullet points. Output raw Markdown only without commentary or surrounding code blocks.'
              },
              { role: 'user', content: text }
            ]
          })
        });

        const data = await response.json();
        currentRawMarkdown = data.choices[0].message.content;

        // Render visual slides in preview area
        const { html, css } = marpit.render(currentRawMarkdown);
        preview.innerHTML = `<style>${css}</style>${html}`;

      } catch (err) {
        alert('Error generating slides: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '✨ Generate Presentation';
      }
    }

    // 3. PowerPoint Export (.pptx)
    function downloadPPTX() {
      if (!currentRawMarkdown) {
        alert('Please generate a presentation first!');
        return;
      }

      let pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';

      // Split raw markdown into individual slides
      const slideTexts = currentRawMarkdown.split(/^---$/m);

      slideTexts.forEach(slideMd => {
        const lines = slideMd.trim().split('\n').filter(l => l.trim().length > 0);
        if (lines.length === 0) return;

        let slide = pptx.addSlide();
        // Set slide dark background
        slide.background = { color: '0F172A' };

        let yPosition = 0.8;

        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('#')) {
            // Heading line
            const titleText = line.replace(/^#+\s*/, '');
            slide.addText(titleText, {
              x: 0.8, y: yPosition, w: '85%',
              fontSize: 24, bold: true, color: '38BDF8',
              fontFace: 'Arial'
            });
            yPosition += 0.9;
          } else if (line.startsWith('-') || line.startsWith('*')) {
            // Bullet point line
            const bulletText = line.replace(/^[-*]\s*/, '').replace(/\*\*(.*?)\*\*/g, '$1');
            slide.addText(bulletText, {
              x: 1.0, y: yPosition, w: '80%',
              fontSize: 16, color: 'F8FAFC',
              bullet: true, fontFace: 'Arial'
            });
            yPosition += 0.5;
          } else {
            // Standard body text
            const cleanText = line.replace(/\*\*(.*?)\*\*/g, '$1');
            slide.addText(cleanText, {
              x: 0.8, y: yPosition, w: '85%',
              fontSize: 15, color: 'CBD5E1',
              fontFace: 'Arial'
            });
            yPosition += 0.5;
          }
        });
      });

      // Save PowerPoint file
      pptx.writeFile({ fileName: 'HW-WEAPON-Presentation.pptx' });
    }
  </script>
</body>
</html>
