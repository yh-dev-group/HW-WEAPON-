<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW-WEAPON Presentation Generator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for Reliable Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- PptxGenJS for PPTX Export -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    .slide-card {
      width: 100%;
      box-sizing: border-box;
      padding: 2.5rem;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .slide-card h1 { color: #38bdf8; font-size: 1.875rem; font-weight: 800; border-bottom: 2px solid #38bdf8; margin-bottom: 1rem; padding-bottom: 0.5rem; }
    .slide-card h2 { color: #38bdf8; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.8rem; }
    .slide-card h3 { color: #7dd3fc; font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    .slide-card p, .slide-card li { font-size: 1.05rem; margin-bottom: 0.5rem; line-height: 1.6; color: #e2e8f0; }
    .slide-card ul { list-style-type: disc; padding-left: 1.5rem; }
    .slide-card ol { list-style-type: decimal; padding-left: 1.5rem; }
    .slide-card strong { color: #38bdf8; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 p-4 bg-slate-900 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-black tracking-tight text-sky-400">🚀 HW-WEAPON</h1>
      <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-medium">100% Free Unlimited AI</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">
    
    <!-- Input Panel -->
    <section class="flex flex-col gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">1. Input Homework / Essay / Notes</h2>
        
        <!-- File Import Button -->
        <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 cursor-pointer transition-all flex items-center gap-1.5 font-medium">
          📁 Import Text File
          <input type="file" id="fileInput" accept=".txt,.md" class="hidden" onchange="importFile(event)">
        </label>
      </div>

      <textarea id="inputText" placeholder="Type your topic, paste your assignment, or import a text file..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:outline-none focus:border-sky-500 resize-none min-h-[350px] leading-relaxed"></textarea>
      
      <button id="generateBtn" onclick="generateSlides()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition-all text-base shadow-lg shadow-sky-500/20">
        ✨ Generate Presentation
      </button>
    </section>

    <!-- Visual Output Panel -->
    <section class="flex flex-col gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">2. Presentation Live Preview</h2>
        
        <div class="flex gap-2">
          <!-- PowerPoint Export Button -->
          <button onclick="downloadPPTX()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 shadow-md shadow-emerald-600/20">
            📊 Download PowerPoint (.pptx)
          </button>
          
          <!-- PDF Export Button -->
          <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition-all font-medium">
            📄 Print / Save PDF
          </button>
        </div>
      </div>

      <div id="previewArea" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-5 overflow-y-auto max-h-[600px]">
        <div class="text-center text-slate-500 py-24">
          <p class="text-base">Your generated presentation slides will render visually right here!</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    window.currentRawMarkdown = "";

    // 1. File Upload Handler
    function importFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('inputText').value = e.target.result;
        };
        reader.readAsText(file);
      }
    }

    // 2. 100% Free AI Generator Engine (via Anonymous URL Route)
    async function generateSlides() {
      const text = document.getElementById('inputText').value;
      const btn = document.getElementById('generateBtn');
      const preview = document.getElementById('previewArea');

      if (!text.trim()) {
        alert('Please enter or import some text first!');
        return;
      }

      btn.disabled = true;
      btn.innerText = '🤖 Free AI Writing Your Presentation...';

      try {
        const promptText = `Convert this topic into a clean Markdown presentation slide deck with 4-5 slides. Use '---' on its own line between slides. Use standard headings (#) and concise bullet points. Output raw Markdown text only without surrounding code block wrappers.\n\nTopic:\n${text}`;

        // Uses clean anonymous GET encoding route (Bypasses Pollinations auth payment check)
        const encodedPrompt = encodeURIComponent(promptText);
        const response = await fetch(`https://text.pollinations.ai/${encodedPrompt}?model=openai`);

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const markdownResult = await response.text();

        // Save raw markdown and clean fence tokens
        window.currentRawMarkdown = markdownResult.replace(/```markdown/gi, '').replace(/```/g, '').trim();

        // Render each slide card into HTML safely with marked.js
        const slideArray = window.currentRawMarkdown.split(/^---$/m);
        let renderedCardsHtml = "";

        slideArray.forEach((slideMd, index) => {
          if (slideMd.trim().length > 0) {
            const slideHtml = window.marked.parse(slideMd.trim());
            renderedCardsHtml += `<div class="slide-card">
              <div class="text-xs font-bold text-sky-400 mb-2 uppercase tracking-wider">Slide ${index + 1}</div>
              ${slideHtml}
            </div>`;
          }
        });

        preview.innerHTML = renderedCardsHtml || '<p class="text-red-400">No slides were generated. Try again.</p>';

      } catch (err) {
        alert('Generation failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '✨ Generate Presentation';
      }
    }

    // 3. PowerPoint Export (.pptx)
    function downloadPPTX() {
      if (!window.currentRawMarkdown) {
        alert('Please generate a presentation first!');
        return;
      }

      let pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';

      const slideTexts = window.currentRawMarkdown.split(/^---$/m);

      slideTexts.forEach(slideMd => {
        const lines = slideMd.trim().split('\n').filter(l => l.trim().length > 0);
        if (lines.length === 0) return;

        let slide = pptx.addSlide();
        slide.background = { color: '0F172A' };

        let yPosition = 0.8;

        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('#')) {
            const titleText = line.replace(/^#+\s*/, '');
            slide.addText(titleText, {
              x: 0.8, y: yPosition, w: '85%',
              fontSize: 24, bold: true, color: '38BDF8',
              fontFace: 'Arial'
            });
            yPosition += 0.9;
          } else if (line.startsWith('-') || line.startsWith('*')) {
            const bulletText = line.replace(/^[-*]\s*/, '').replace(/\*\*(.*?)\*\*/g, '$1');
            slide.addText(bulletText, {
              x: 1.0, y: yPosition, w: '80%',
              fontSize: 16, color: 'F8FAFC',
              bullet: true, fontFace: 'Arial'
            });
            yPosition += 0.5;
          } else {
            const cleanText = line.replace(/\*\*(.*?)\*\*/g, '$1');
            slide.addText(cleanText, {
              x: 0.8, y: yPosition, w: '85%',
              fontSize: 15, color: 'CBD5E1',
              fontFace: 'Arial'
            });
            yPosition += 0.5;
          }
        });
      });

      pptx.writeFile({ fileName: 'HW-WEAPON-Presentation.pptx' });
    }
  </script>
</body>
</html>
