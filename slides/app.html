<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW-WEAPON Presentation Generator</title>
  <!-- Tailwind CSS for sleek custom UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marpit Web Engine to render Marp Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/@marp-team/marpit@2.4.0/lib/marpit.umd.js"></script>
  <style>
    .slide-preview section {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 2rem;
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      border-radius: 8px;
    }
    .slide-preview h1 { color: #38bdf8; font-size: 2rem; border-bottom: 2px solid #38bdf8; margin-bottom: 1rem; }
    .slide-preview p, .slide-preview li { font-size: 1.1rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 p-4 bg-slate-900 flex justify-between items-center">
    <h1 class="text-2xl font-bold tracking-tight text-sky-400">🚀 HW-WEAPON <span class="text-xs text-slate-400 font-normal">v1.0</span></h1>
    <div class="flex items-center gap-2">
      <input type="password" id="apiKey" placeholder="DeepSeek API Key" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded text-sm outline-none focus:border-sky-500 w-48">
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
    
    <!-- Input Panel -->
    <section class="flex flex-col gap-3 bg-slate-900 p-4 rounded-xl border border-slate-800">
      <h2 class="text-lg font-semibold text-slate-200">1. Topic or Notes Input</h2>
      <textarea id="inputText" placeholder="Paste your homework text, essay, or bullet points here..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 resize-none min-h-[300px]"></textarea>
      
      <div class="flex justify-between items-center">
        <button id="generateBtn" onclick="generateSlides()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 px-6 rounded-lg transition-all text-sm">
          ✨ Generate Presentation
        </button>
        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-lg text-sm border border-slate-700">
          📥 Download PDF / Print
        </button>
      </div>
    </section>

    <!-- Visual Output Panel -->
    <section class="flex flex-col gap-3 bg-slate-900 p-4 rounded-xl border border-slate-800">
      <h2 class="text-lg font-semibold text-slate-200">2. Presentation Live Preview</h2>
      <div id="previewArea" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-4 overflow-y-auto space-y-4 max-h-[600px] slide-preview">
        <div class="text-center text-slate-500 py-12">Your generated slides will render visually right here!</div>
      </div>
    </section>

  </main>

  <script>
    const marpit = new window.Marpit.Marpit();

    async function generateSlides() {
      const apiKey = document.getElementById('apiKey').value;
      const text = document.getElementById('inputText').value;
      const btn = document.getElementById('generateBtn');
      const preview = document.getElementById('previewArea');

      if (!apiKey) {
        alert('Please enter your DeepSeek API Key at the top right!');
        return;
      }
      if (!text.trim()) {
        alert('Please enter some text or notes to generate slides!');
        return;
      }

      btn.disabled = true;
      btn.innerText = '🤖 AI Writing Slides...';

      try {
        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              {
                role: 'system',
                content: 'You are HW-WEAPON. Convert the user input into clean Markdown presentation slides. Use `---` on its own line to separate slides. Limit to 3-4 key points per slide. Output raw text only without backticks.'
              },
              { role: 'user', content: text }
            ]
          })
        });

        const data = await response.json();
        const markdown = data.choices[0].message.content;

        // Render HTML visually inside preview box
        const { html, css } = marpit.render(markdown);
        preview.innerHTML = `<style>${css}</style>${html}`;

      } catch (err) {
        alert('Error generating slides: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '✨ Generate Presentation';
      }
    }
  </script>
</body>
</html>
